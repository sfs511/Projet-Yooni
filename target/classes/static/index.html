<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yooni Delivery - Senegal Trip Planner</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="trip-planner">

<!-- SIDEBAR -->
<div id="sidebar">
    <h1>Senegal Trip Planner</h1>

    <div id="tcpStatus" class="network-badge offline">TCP : verification...</div>

    <div class="control-group">
        <label for="startNode">Depart :</label>
        <select id="startNode">
            <option value="">Selectionnez une region</option>
        </select>
    </div>

    <div class="control-group">
        <label for="endNode">Destination :</label>
        <select id="endNode">
            <option value="">Selectionnez une region</option>
        </select>
    </div>

    <div class="control-group">
        <label for="algorithmeSelect">Algorithme :</label>
        <select id="algorithmeSelect">
            <option value="dijkstra">Dijkstra (plus court chemin)</option>
            <option value="bellmanford">Bellman-Ford (plus court chemin)</option>
        </select>
    </div>

    <div class="control-group">
        <label for="transportSelect">Mode reseau :</label>
        <select id="transportSelect">
            <option value="http">HTTP REST (standard)</option>
        </select>
    </div>

    <div id="tripDetails">
        <h3>Details du voyage</h3>
        <p id="pathOutput">Veuillez choisir un itineraire.</p>
    </div>

    <div id="tcpConsole">
        <div class="tcp-header">
            <span>Console Algo</span>
        </div>
        <div id="tcpLog" class="tcp-log">
            <div class="tcp-line">Initialisation...</div>
        </div>
    </div>

    <div style="margin-top: auto; padding-top: 10px; border-top: 1px solid #ddd;">
        <a href="/login.html" style="color: #27ae60; text-decoration: none; font-weight: 600;">Acceder a Yooni Delivery</a>
    </div>
</div>

<!-- CARTE -->
<div id="map-container">
    <div id="map-buttons">
        <button id="planTripBtn" class="map-btn btn-green">Calculer l'itineraire</button>
        <button id="tspBtn" class="map-btn btn-blue">Tour complet du Senegal (TSP)</button>
    </div>
    <div id="map"></div>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="js/app.js"></script>

</body>
</html>
