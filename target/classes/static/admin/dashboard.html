<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yooni Delivery - Admin Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">Yooni Delivery - Admin</div>
        <div class="nav-links">
            <a href="/admin/dashboard.html">Dashboard</a>
            <a href="/admin/utilisateur.html">Utilisateurs</a>
            <a href="/index.html">Trip Planner</a>
            <button id="logoutBtn" class="btn btn-secondary">Deconnexion</button>
        </div>
    </nav>

    <main class="container">
        <h1>Tableau de bord</h1>

        <div class="stats-grid">
            <div class="stat-card">
                <h3>Clients</h3>
                <p class="stat-number" id="totalClients">0</p>
            </div>
            <div class="stat-card">
                <h3>Livreurs</h3>
                <p class="stat-number" id="totalLivreurs">0</p>
            </div>
            <div class="stat-card">
                <h3>Livraisons</h3>
                <p class="stat-number" id="totalLivraisons">0</p>
            </div>
            <div class="stat-card">
                <h3>En cours</h3>
                <p class="stat-number" id="livraisonsEnCours">0</p>
            </div>
        </div>

        <section class="section">
            <h2>Livraisons recentes</h2>
            <div id="recentLivraisons" class="table-container"></div>
        </section>

        <section class="section">
            <h2>Livreurs disponibles</h2>
            <div id="availableLivreurs" class="table-container"></div>
        </section>
    </main>

    <script src="/js/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const token = localStorage.getItem('token');
            if (!token) { window.location.href = '/login.html'; return; }

            loadDashboard();

            document.getElementById('logoutBtn').addEventListener('click', () => {
                localStorage.clear();
                window.location.href = '/login.html';
            });
        });

        async function loadDashboard() {
            try {
                const [clients, livreurs, livraisons] = await Promise.all([
                    fetch('/api/client').then(r => r.json()),
                    fetch('/api/livreur').then(r => r.json()),
                    fetch('/api/livraisons').then(r => r.json())
                ]);

                document.getElementById('totalClients').textContent = clients.length;
                document.getElementById('totalLivreurs').textContent = livreurs.length;
                document.getElementById('totalLivraisons').textContent = livraisons.length;
                document.getElementById('livraisonsEnCours').textContent =
                    livraisons.filter(l => ['PRISE_EN_CHARGE', 'EN_COURS'].includes(l.statut)).length;

                renderLivraisons(livraisons.slice(0, 5));
                renderLivreursDisponibles(livreurs.filter(l => l.statut === 'DISPONIBLE'));
            } catch (e) {
                console.error('Erreur chargement dashboard:', e);
            }
        }

        function renderLivraisons(livraisons) {
            const container = document.getElementById('recentLivraisons');
            if (livraisons.length === 0) {
                container.innerHTML = '<p>Aucune livraison</p>';
                return;
            }
            container.innerHTML = `
                <table>
                    <thead><tr><th>ID</th><th>Client</th><th>Statut</th><th>Prix</th></tr></thead>
                    <tbody>
                        ${livraisons.map(l => `
                            <tr>
                                <td>#${l.id}</td>
                                <td>${l.clientNom}</td>
                                <td><span class="badge badge-${l.statut.toLowerCase()}">${l.statut}</span></td>
                                <td>${l.prix} FCFA</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
        }

        function renderLivreursDisponibles(livreurs) {
            const container = document.getElementById('availableLivreurs');
            if (livreurs.length === 0) {
                container.innerHTML = '<p>Aucun livreur disponible</p>';
                return;
            }
            container.innerHTML = `
                <table>
                    <thead><tr><th>Nom</th><th>Vehicule</th><th>Zone</th></tr></thead>
                    <tbody>
                        ${livreurs.map(l => `
                            <tr>
                                <td>${l.nom} ${l.prenom}</td>
                                <td>${l.vehicule || '-'}</td>
                                <td>${l.zone || '-'}</td>
                            </tr>
                        `).join('')}
                    </tbody>
                </table>`;
        }
    </script>
</body>
</html>
